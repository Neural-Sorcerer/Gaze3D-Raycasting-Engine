camera:
  intrinsics:
    fx: 920.0
    fy: 920.0
    cx: 640.0
    cy: 360.0
    width: 1280
    height: 720
  pose_world:
    # Camera mounted above the center TV.
    translation: [0.0, 1.66, 1.24]
    look_at:
      target: [0.0, 0.35, 0.82]
      up: [0.0, 0.0, 1.0]

scene:
  plane:
    point: [0.0, 0.0, 0.0]
    normal: [0.0, 0.0, 1.0]
    size: [6.0, 6.0]
    color: [0.2, 0.8, 1.0, 0.20]
  objects:
    # Center TV is farther back. Side TVs are yawed inward 30 deg and touch center at inner edges.
    # Frame bezel is ~1% of TV width and height.
    - type: obb
      name: tv_left_frame
      center: [-1.57, 1.24, 0.86]
      size: [1.68, 0.03, 0.55]
      euler_deg: [0.0, 0.0, 30.0]
      color: [0.19, 0.21, 0.25, 0.42]
    - type: obb
      name: tv_center_frame
      center: [0.00, 1.66, 0.86]
      size: [1.68, 0.03, 0.55]
      euler_deg: [0.0, 0.0, 0.0]
      color: [0.19, 0.21, 0.25, 0.42]
    - type: obb
      name: tv_right_frame
      center: [1.57, 1.24, 0.86]
      size: [1.68, 0.03, 0.55]
      euler_deg: [0.0, 0.0, -30.0]
      color: [0.19, 0.21, 0.25, 0.42]

    - type: obb
      name: tv_left_screen
      center: [-1.57, 1.24, 0.86]
      size: [1.6464, 0.012, 0.539]
      euler_deg: [0.0, 0.0, 30.0]
      color: [0.20, 0.68, 0.96, 0.58]
    - type: obb
      name: tv_center_screen
      center: [0.00, 1.66, 0.86]
      size: [1.6464, 0.012, 0.539]
      euler_deg: [0.0, 0.0, 0.0]
      color: [0.16, 0.80, 1.00, 0.58]
    - type: obb
      name: tv_right_screen
      center: [1.57, 1.24, 0.86]
      size: [1.6464, 0.012, 0.539]
      euler_deg: [0.0, 0.0, -30.0]
      color: [0.19, 0.65, 0.95, 0.58]

    - type: obb
      name: tv_left_stand
      center: [-1.57, 1.27, 0.29]
      size: [0.16, 0.08, 0.58]
      euler_deg: [0.0, 0.0, 30.0]
      color: [0.34, 0.36, 0.42, 0.32]
    - type: obb
      name: tv_center_stand
      center: [0.00, 1.69, 0.29]
      size: [0.16, 0.08, 0.58]
      euler_deg: [0.0, 0.0, 0.0]
      color: [0.34, 0.36, 0.42, 0.32]
    - type: obb
      name: tv_right_stand
      center: [1.57, 1.27, 0.29]
      size: [0.16, 0.08, 0.58]
      euler_deg: [0.0, 0.0, -30.0]
      color: [0.34, 0.36, 0.42, 0.32]

    - type: sphere
      name: decor_sphere_left
      center: [-2.60, 0.92, 0.24]
      radius: 0.24
      color: [0.90, 0.45, 0.35, 0.35]
    - type: sphere
      name: decor_sphere_right
      center: [2.62, 1.06, 0.20]
      radius: 0.20
      color: [0.35, 0.88, 0.52, 0.35]
    - type: box
      name: decor_cube_left
      min: [-2.95, 0.24, 0.00]
      max: [-2.55, 0.60, 0.36]
      color: [0.95, 0.78, 0.28, 0.34]
    - type: box
      name: decor_cube_right
      min: [2.55, 0.16, 0.00]
      max: [2.95, 0.52, 0.30]
      color: [0.75, 0.50, 0.95, 0.34]

filters:
  mode: one_euro
  ema_alpha: 0.30
  one_euro:
    min_cutoff: 1.0
    beta: 0.03
    d_cutoff: 1.0

data_sources:
  synthetic:
    seed: 13
    noise_std: 0.04
    motion_scale: 1.25
    translation_amplitude: [0.15, 0.10, 0.05]
    rotation_amplitude_deg: [2.4, 3.5, 5.0]
    gaze_xy_amplitude: [0.16, 0.12]
    gaze_depth: 1.05
    micro_saccade_interval: 1.3
    micro_saccade_strength: 0.07
    micro_saccade_decay: 8.5
    focus_targets_world:
      - [-1.57, 1.24, 0.86]
      - [0.00, 1.66, 0.86]
      - [1.57, 1.24, 0.86]
    focus_switch_interval: 1.1
    focus_jitter_std: 0.05
    focus_pull: 0.88
    head_focus_pull: 0.82
    head_parallel_angle_deg: -15.0
    head_parallel_angle_variation_deg: 5.0
    head_parallel_osc_speed: 1.2
  webcam:
    camera_index: 0
  recorded:
    path: data/recorded_demo.csv
    loop: true
    speed: 1.0

render:
  target_fps: 60
  ray_length: 6.4
  head_axis_length: 0.16
